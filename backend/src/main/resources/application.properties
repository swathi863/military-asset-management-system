server.port=8080

# Active Profile (configured via env SPRING_PROFILES_ACTIVE with fallback)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Application Name
spring.application.name=military-asset-management

# JWT Secret & Expiration (requires JWT_SECRET from environment)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
