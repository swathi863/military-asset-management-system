# H2 In-Memory Database Configuration for Development/Testing
spring.datasource.url=jdbc:h2:mem:military_asset_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e6c4b2a0d9e8f7c6b5a4d3e2f1a0b9c8d7e6f5a4b3c2d1e}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
